    <!-- ==================== SCRIPTS ==================== -->
    <script>
        /**
         * Compartilha o perfil usando Web Share API ou copia o link
         */
        function shareProfile() {
            if (navigator.share) {
                navigator.share({
                    title: 'VitãoTub | Links Oficiais',
                    text: 'Confira os canais oficiais do VitãoTub!',
                    url: window.location.href
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    showToast("Link copiado com sucesso!");
                });
            }
        }

        /**
         * Exibe um toast temporário na tela
         * @param {string} message - Mensagem a ser exibida
         */
        function showToast(message) {
            // Remove toast anterior se existir
            const oldToast = document.querySelector('.bio-toast');
            if (oldToast) oldToast.remove();
            
            // Cria novo toast
            const toast = document.createElement('div');
            toast.className = 'bio-toast';
            toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
            document.body.appendChild(toast);
            
            // Anima entrada e saída
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        /**
         * Efeito de pulso nos botões ao clicar
         */
        const allButtons = document.querySelectorAll('.bio-item, .btn-home');

        allButtons.forEach(button => {
            button.addEventListener('click', function() {
                this.classList.add('pulse-active');
                setTimeout(() => {
                    this.classList.remove('pulse-active');
                }, 400);
            });
        });
    </script>
